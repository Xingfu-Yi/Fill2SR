[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "fill2sr"
version = "1.0.0"
description = "Official ECCV 2026 inference code for Fill2SR real-world super-resolution."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}

dependencies = [
    "accelerate==1.3.0",
    "numpy>=1.26,<3",
    "safetensors>=0.4.0",
    "torchvision>=0.20",
    "diffusers==0.32.1",
    "protobuf==6.31.1",
    "peft==0.16.0",
    "sentencepiece==0.2.0",
    "transformers==4.52.4",
    "Pillow>=10.0",
    "PyYAML>=6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/fill2sr"]
